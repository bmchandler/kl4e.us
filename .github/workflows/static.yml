# Build the Zola site and deploy it to GitHub Pages.
name: Deploy Zola site to Pages

on:
  # Deploy on every push to the default branch.
  push:
    branches: ["main"]

  # Allow manual runs from the Actions tab.
  workflow_dispatch:

# Grant GITHUB_TOKEN the permissions needed to deploy to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let in-progress production deploys finish.
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  # Keep in sync with the local Zola version.
  ZOLA_VERSION: "0.23.6"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zola ${{ env.ZOLA_VERSION }}
        run: |
          curl -sSfL \
            "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz
          sudo mv zola /usr/local/bin/zola
          zola --version

      - name: Build
        # --drafts is omitted: only published content ships.
        run: zola build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "public"

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
