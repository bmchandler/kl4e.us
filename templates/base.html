<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}KL4E — Brian Chandler · Amateur Radio Station{% endblock title %}</title>
<meta name="description" content="{% block description %}Amateur radio station KL4E — Brian Chandler, Amateur Extra, Kernersville NC. Station notes, band logs, experiments, and ham software.{% endblock description %}">
<link rel="icon" href="{{ get_url(path='assets/img/favicon.svg') }}" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="{{ get_url(path='assets/css/styles.css') }}">
<script src="{{ get_url(path='assets/js/theme.js') }}"></script>
{% block head_extra %}{% endblock head_extra %}
</head>
<body>

<header class="site">
  <div class="wrap bar">
    <div class="brandwrap">
      <a class="brand" href="{{ get_url(path='@/_index.md') }}"><span class="call">KL4E</span><span class="who">Brian Chandler</span></a>
      <button class="themebtn" id="theme-toggle" type="button" aria-label="Switch color theme">
        <svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
    {% set cp = current_path | default(value="") %}
    <nav class="main" aria-label="Primary">
      <a href="{{ get_url(path='@/_index.md') }}"{% if cp == "/" %} aria-current="page"{% endif %}>Home</a>
      <a href="{{ get_url(path='@/bands/_index.md') }}"{% if "/bands" in cp %} aria-current="page"{% endif %}>Bands</a>
      <a href="{{ get_url(path='@/experiments/_index.md') }}"{% if "/experiments" in cp %} aria-current="page"{% endif %}>Experiments</a>
      <a href="{{ get_url(path='@/software/_index.md') }}"{% if "/software" in cp %} aria-current="page"{% endif %}>Software</a>
      <a class="ext" href="https://www.qrz.com/db/KL4E">QRZ&nbsp;Profile&nbsp;↗</a>
    </nav>
  </div>
</header>

<main class="wrap" style="padding-top:{% block main_top %}56px{% endblock main_top %}">
{% block content %}{% endblock content %}
</main>

<footer class="site">
  <div class="wrap bar">
    <span class="mono">73 de KL4E · Brian in Kernersville, NC</span>
    <span class="built">Built with AI<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="8" width="14" height="11" rx="3"/><path d="M12 8V5.2"/><circle cx="12" cy="3.8" r="1.3" fill="currentColor" stroke="none"/><path d="M3 13v-1.5"/><path d="M21 13v-1.5"/><circle cx="9.5" cy="13" r="1.15" fill="currentColor" stroke="none"/><circle cx="14.5" cy="13" r="1.15" fill="currentColor" stroke="none"/><path d="M9.5 16h5"/></svg><svg class="heart" width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21 C 12 21 4 15.5 4 9.6 C 4 6.8 6.1 5.2 8.1 5.2 C 9.9 5.2 11.2 6.3 12 7.5 C 12.8 6.3 14.1 5.2 15.9 5.2 C 17.9 5.2 20 6.8 20 9.6 C 20 15.5 12 21 12 21 Z"/></svg></span>
  </div>
</footer>

</body>
</html>
